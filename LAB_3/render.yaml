services:
  - type: web
    name: bdf-lab-3
    env: node
    plan: free
    region: oregon
    rootDir: LAB_3
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
